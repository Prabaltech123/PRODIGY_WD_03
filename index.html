
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe | Play with AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header>
            <div class="game-icon">✦</div>
            <h1>Tic-Tac-Toe</h1>
            <p>Think smart. Play your best.</p>
        </header>

        <div class="mode-box">
            <label for="mode">Game mode</label>
            <select id="mode">
                <option value="ai">🤖 Play with AI</option>
                <option value="friend">👥 Two Players</option>
            </select>
        </div>

        <div class="scores">
            <div class="score-card active" id="xCard">
                <span>PLAYER X</span>
                <strong id="scoreX">0</strong>
                <small id="xLabel">You</small>
            </div>
            <div class="score-card" id="oCard">
                <span id="oTitle">AI PLAYER O</span>
                <strong id="scoreO">0</strong>
                <small id="oLabel">Computer</small>
            </div>
        </div>

        <div class="status" id="status" aria-live="polite">
            Your turn — choose a square!
        </div>

        <div class="board" id="board">
            <button class="cell" data-index="0" aria-label="Square 1"></button>
            <button class="cell" data-index="1" aria-label="Square 2"></button>
            <button class="cell" data-index="2" aria-label="Square 3"></button>
            <button class="cell" data-index="3" aria-label="Square 4"></button>
            <button class="cell" data-index="4" aria-label="Square 5"></button>
            <button class="cell" data-index="5" aria-label="Square 6"></button>
            <button class="cell" data-index="6" aria-label="Square 7"></button>
            <button class="cell" data-index="7" aria-label="Square 8"></button>
            <button class="cell" data-index="8" aria-label="Square 9"></button>
        </div>

        <div class="actions">
            <button id="restart">↻ New Round</button>
            <button id="reset">Reset Scores</button>
        </div>

        <p class="footer">Made with HTML, CSS & JavaScript</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
